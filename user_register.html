<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Dronche.BG</title>
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="user_register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <nav>
        <div class="logo">
            <p>DRONCHE.BG</p>
        </div>
        
        <button class="mobile-menu-toggle" aria-label="Меню">☰</button>
        
        <ul class="menu">
            <li><a href="homepage.html">НАЧАЛНА СТРАНИЦА</a></li>
            <li class="dropdown">
                <button class="dropdown-btn">КАТАЛОГ <i class="fas fa-chevron-down"></i></button>
                <div class="dropdown-content">
                    <a href="Catalog.html">Дронове</a>
                    <a href="rc-planes.html">RC Самолети</a>
                    <a href="rc-boats.html">RC Лодки</a>
                    <a href="rc-cars.html">RC Коли</a>
                    <a href="batteries.html">Батерии</a>
                    <a href="joysticks.html">Джойстици</a>
                </div>
            </li>
            <li><a href="kont.html"><i class="fas fa-shopping-cart"></i> КОЛИЧКА</a></li>
        </ul>
    </nav>
    
    <main id="main-content">
        <div class="login-container">
            <div class="login-box">
                <h1 class="login-title">Регистрация</h1>
                <form class="login-form" id="registrationForm">
                    <div class="form-group">
                        <label for="fullname">Пълно име</label>
                        <input type="text" id="fullname" name="fullname" required placeholder="Въведи своето пълно име">
                        <span class="error-message" id="fullnameError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email адрес</label>
                        <input type="email" id="email" name="email" required placeholder="Въведи своя email">
                        <span class="error-message" id="emailError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароля</label>
                        <input type="password" id="password" name="password" required placeholder="Въведи своя пароля">
                        <span class="error-message" id="passwordError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm-password">Потвърди паролата</label>
                        <input type="password" id="confirm-password" name="confirm-password" required placeholder="Потвърди своя пароля">
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="terms" required>
                            Съгласен/а съм с условията
                        </label>
                    </div>
                    
                    <button type="submit" class="login-btn">Регистрирай се</button>
                </form>
                
                <div class="signup-link">
                    Имаш акаунт? <a href="#">Влез тук</a>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="footer-section">
        <div class="footer-content">
            <div class="footer-cta">
                <div class="single-cta">
                    <i class="fas fa-map-marker-alt"></i>
                    <div class="cta-text">
                        <h4>Намери ни</h4>
                        <span>България, София</span>
                    </div>
                </div>
                <div class="single-cta">
                    <i class="fas fa-phone"></i>
                    <div class="cta-text">
                        <h4>Обади ни се</h4>
                        <span>+359 123 456 789</span>
                    </div>
                </div>
                <div class="single-cta">
                    <i class="far fa-envelope-open"></i>
                    <div class="cta-text">
                        <h4>Напиши ни</h4>
                        <span>info@dronche.bg</span>
                    </div>
                </div>
            </div>
            <div class="footer-social-icon">
                <span>Последвай ни</span>
                <a href="https://www.facebook.com"><i class="fab fa-facebook-f facebook-bg"></i></a>
                <a href="https://www.instagram.com"><i class="fab fa-instagram twitter-bg"></i></a>
                <a href="https://www.youtube.com"><i class="fab fa-youtube google-bg"></i></a>
            </div>
        </div>
        <div class="copyright-area">
            <p>&copy; Dronche.BG | Всички права запазени</p>
        </div>
    </footer>
    
    <script>
        document.querySelector('.mobile-menu-toggle').addEventListener('click', function() {
            document.querySelector('nav ul.menu').classList.toggle('show');
            this.classList.toggle('open');
        });

        const dropdownBtn = document.querySelector('.dropdown-btn'); 
        if (dropdownBtn) {
            dropdownBtn.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    this.nextElementSibling.classList.toggle('show');
                    const icon = this.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-chevron-up');
                    }
                }
            });
        }

        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768 && !e.target.matches('.dropdown-btn') && !e.target.closest('.dropdown-content')) {
                document.querySelectorAll('.dropdown-content').forEach(dropdown => {
                    dropdown.classList.remove('show');
                });
            }
        });

        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Паролите не съвпадат';
                return;
            }
            // Handle registration logic here
        });
    </script>
</body>
</html>
